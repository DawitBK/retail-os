# Local PostgreSQL 18 for development and integration tests.
#   pnpm db:up
#   export DATABASE_URL=postgres://retail:retail@localhost:5432/retail_test
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      POSTGRES_DB: retail
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U retail -d retail']
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
